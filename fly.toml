app = "breakgen-alpha"
primary_region = "sjc"

[build]
  dockerfile = "docker/Dockerfile.prod"

[env]
  BREAKGEN_DEBUG = "false"
  BREAKGEN_ARTIFACT_STORAGE_BACKEND = "r2"
  BREAKGEN_CORS_ORIGINS = "https://breakgen-alpha.fly.dev"
  BREAKGEN_PUBLIC_SIGNUP_ENABLED = "false"
  BREAKGEN_UVICORN_WORKERS = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
